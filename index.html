function cmd(x,y){pops++;hud();SFX.boom();ring('#ff2e88',x,y);for(const p of P){if(p.c||p.dvd)continue;const dx=p.x-x,dy=p.y-y,d=Math.hypot(dx,dy)||1;if(d<320){const v=(320-d)/320*18;p.vx=(p.vx||0)+dx/d*v;p.vy=(p.vy||0)+dy/d*v}}if(navigator.vibrate)navigator.vibrate(15)}
function spaceFx(s,dt){const u=s.tt;
 if(!s.k){s.k=1;SFX.boom();s.pz=sp('🚀',W/2,H*.72,{s:130,life:700,noPop:1,m:'x',r:-.785});ring('#ffb703',W/2,H*.78);flash();for(let i=0;i<7;i++)sp(['🪐','🌍','🌕','🌑'][i%4],W/2,H/2,{m:'orbit',ang:R(0,6.28),rad:R(140,420),va:R(.006,.02)*(i%2?1:-1),vr2:0,s:R(60,110),life:700,noPop:1})}
 const z=s.pz;if(!z)return;const b=mouse.down?1.7:1;s.sq=(s.sq||0)+dt;if(s.sq>18){s.sq=0;noise(.3,.05*b,500)}
 z.x+=(Math.max(40,Math.min(W-40,mouse.x))-z.x)*.12*dt;z.y=H*.72+Math.sin(u*40)*3;z.r=-.785+(mouse.x-z.x)*.002;
 shake=Math.max(shake,u<1?9:2.5*b);
 rate(u<1?2.5:3*b,dt,()=>sp('●',z.x+R(-8,8),z.y+z.s*.4,{c:Math.random()<.5?'#ffb703':'#ff2e88',vy:R(4,9),vx:R(-1,1),s:R(16,36),life:18,gr:.94}));
 if(u>1)rate(1.4*b,dt,()=>sp('●',R(0,W),-30,{c:'#f6efe0',vy:R(28,46)*b,s:5,sy:16,life:50}));
 if(u>1.4&&u<7)rate(.04*b,dt,()=>sp('☄️',R(60,W-60),-60,{vy:R(9,14)*b,s:R(60,100),vr:R(-.1,.1),life:200,ast:1,noPop:1}));
 if(u>4.4&&u<7)rate(.12,dt,()=>sp(['👽','🛸'][Math.random()*2|0],-60,H*.4+R(-20,20),{vx:2.5,s:R(56,80),life:600,vr:R(-.02,.02),noPop:1}));
 for(const p of P){if(!p.ast||p.life<=0)continue;
  if(Math.hypot(p.x-z.x,p.y-z.y)<(p.s+z.s)*.32){p.life=0;hud();shake=32;flash();SFX.slap();ring('#ff2e88',z.x,z.y)}
  else if(p.y>H-30&&!p.cnt){p.cnt=1;pops++;hud()}}}
function pop(x,y){for(let i=P.length-1;i>=0;i--){const p=P[i];if(p.c||p.life<=0||p.noPop||p.g==='✨')continue;if(Math.hypot(p.x-x,p.y-y)<p.s*.55+14){p.life=0;pops+=p.s>300?5:1;hud();SFX.pop();const n=p.s>300?30:10;for(let j=0;j<n;j++){const a=R(0,6.28),v=R(2,10);sp('●',p.x,p.y,{c:['#14e3c8','#ff2e88','#ffb703'][j%3],vx:Math.cos(a)*v,vy:Math.sin(a)*v,s:R(8,26),life:40,gr:1.02,free:1})}if(p.s>300)shake=Math.max(shake,12);if(navigator.vibrate)navigator.vibrate(12);return}}}
function flash(){if(RM)return;const f=$('flash');f.classList.remove('on');void f.offsetWidth;f.classList.add('on')}
function pizzaFx(s){const pz=s.pz,u=s.tt;if(!pz||u<3.2)return;
 if(!s.g){s.g=1;pz.gr=1;pz.vr=0;s.b=pz.s}
 let ox=0,m=1,rot=0,sx=1,sy=1,busy=0;
 [4.6,5.7].forEach((t,i)=>{const d=i?1:-1;
  if(u>=t-.45&&u<t){const k=(u-t+.45)/.45;ox=-d*W*.3*k;rot=-d*.7*k;m=1-.12*k;busy=1}
  else if(u>=t&&u<t+.12){const k=(u-t)/.12;ox=-d*W*.3+d*W*.5*k;rot=-d*.7+d*1.6*k;m=.88+k;busy=1;
   if(!s.h[i]){s.h[i]=1;shake=36;flash();SFX.slap();ring('#ff2e88',W/2+ox,H/2);sp('💥',W/2+d*W*.2,H/2,{s:160,gr:1.06,life:16});if(navigator.vibrate)navigator.vibrate(70)}}
  else if(u>=t+.12&&u<t+.62){const e=1-(u-t-.12)/.5,q=e*e;ox=d*W*.2*q;rot=d*.9*q+Math.sin(u*30)*.25*q;m=1+.88*q;busy=1}});
 if(!busy){const w=Math.sin(u*22),a=u<4.15?Math.min(1,(u-3.2)/.3):.6;rot=w*.3*a;sx=1-w*.14*a;sy=1+w*.14*a}
 pz.x=W/2+ox;pz.y=H/2;pz.s=s.b*m;pz.r=rot;pz.sx=sx;pz.sy=sy}
const SPR={},GL={};
function spr(g){if(SPR[g])return SPR[g];const c=document.createElement('canvas');c.width=c.height=128;const x=c.getContext('2d');x.font=`104px ${FONT}`;x.textAlign='center';x.textBaseline='middle';x.fillText(g,64,68);return SPR[g]=c}
function glow(col){if(GL[col])return GL[col];const c=document.createElement('canvas');c.width=c.height=64;const x=c.getContext('2d'),g=x.createRadialGradient(32,32,0,32,32,32);g.addColorStop(0,col);g.addColorStop(.5,col+'88');g.addColorStop(1,col+'00');x.fillStyle=g;x.fillRect(0,0,64,64);return GL[col]=c}
function lampS(){return Math.min(W,H*1.1)/460*lamp.k}
function drawLamp(gl){const s=lampS();ctx.save();ctx.translate(lamp.x,lamp.y);ctx.scale(s,s);
 ctx.globalAlpha=.2+gl*.7;ctx.drawImage(glow('#ffb703'),-320,-320,640,640);ctx.globalAlpha=1;
 const b=ctx.createLinearGradient(0,-60,0,70);b.addColorStop(0,'#ffe27a');b.addColorStop(.5,'#ffb703');b.addColorStop(1,'#a86100');ctx.fillStyle=b;
 ctx.beginPath();ctx.ellipse(0,10,110,55,0,0,7);ctx.fill();ctx.fillRect(-45,55,90,16);
 ctx.beginPath();ctx.moveTo(90,-5);ctx.quadraticCurveTo(165,-20,185,-80);ctx.quadraticCurveTo(150,-35,85,35);ctx.closePath();ctx.fill();
 ctx.lineWidth=14;ctx.strokeStyle='#e69a00';ctx.beginPath();ctx.moveTo(-100,-5);ctx.bezierCurveTo(-190,-30,-190,70,-95,45);ctx.stroke();
 ctx.fillStyle='#ffd24d';ctx.beginPath();ctx.ellipse(0,-38,48,22,0,Math.PI,0);ctx.fill();ctx.beginPath();ctx.arc(0,-68,10,0,7);ctx.fill();
 ctx.strokeStyle='rgba(255,255,255,.55)';ctx.lineWidth=7;ctx.beginPath();ctx.arc(-10,10,70,Math.PI*1.1,Math.PI*1.45);ctx.stroke();ctx.restore()}

function update(dt){for(const p of P){const d=dt*(p.free?1:ts);
 if(p.m==='suck'){const dx=lamp.x-p.x,dy=lamp.y-p.y;p.vx+=dx*.002*dt;p.vy+=dy*.002*dt;p.vx*=.94;p.vy*=.94;p.x+=p.vx*dt;p.y+=p.vy*dt;p.s*=.985;if(Math.hypot(dx,dy)<40)p.life=0}
 else if(p.m==='orbit'){p.ang+=p.va*d;p.rad=Math.max(0,p.rad+p.vr2*d);p.x=W/2+Math.cos(p.ang)*p.rad;p.y=H/2+Math.sin(p.ang)*p.rad*.6}
 else if(p.m==='chase'){p.vx+=(mouse.x-p.x)*.0008*d;p.vy+=(mouse.y-p.y)*.0008*d;p.vx*=Math.pow(.97,d);p.vy*=Math.pow(.97,d);p.x+=p.vx*d;p.y+=p.vy*d}
 else if(p.dvd){p.x+=p.vx*d;p.y+=p.vy*d;if(p.x<0||p.x>W)p.vx*=-1;if(p.y<0||p.y>H)p.vy*=-1;p.x=Math.max(0,Math.min(W,p.x));p.y=Math.max(0,Math.min(H,p.y))}
 else{p.vy+=p.grav*d;p.x+=p.vx*d;p.y+=p.vy*d;if(p.bounce&&p.y>H-p.s/2){p.y=H-p.s/2;p.vy*=-p.bounce;p.vx*=.98}}
 p.r+=p.vr*d;p.s*=Math.pow(p.gr,d);if(p.s>900)p.s=900;p.life-=d}
 P=P.filter(p=>p.life>0&&p.s>1&&p.y>-500&&p.y<H+700&&p.x>-500&&p.x<W+500)}
function draw(){for(const p of P){const X=(p.x+SX)*DP,Y=(p.y+SY)*DP;
 if(p.c){ctx.globalCompositeOperation='lighter';ctx.globalAlpha=Math.max(0,Math.min(1,p.life/p.max));const z=p.s*1.6,gw=z*(p.sx||1),gh=z*(p.sy||1);ctx.setTransform(DP,0,0,DP,X,Y);ctx.drawImage(glow(p.c),-gw/2,-gh/2,gw,gh)}
 else{ctx.globalCompositeOperation='source-over';ctx.globalAlpha=p.al==null?1:p.al;const c=Math.cos(p.r)*DP,s=Math.sin(p.r)*DP,z=p.s*1.15;ctx.setTransform(c,s,-s,c,X,Y);const zw=z*(p.sx||1),zh=z*(p.sy||1);ctx.drawImage(spr(p.g),-zw/2,-zh/2,zw,zh)}}
 ctx.setTransform(DP,0,0,DP,SX*DP,SY*DP);ctx.globalAlpha=1;
 ctx.globalCompositeOperation='lighter';
 for(const r of rings){ctx.globalAlpha=Math.max(0,r.a);ctx.strokeStyle=r.c;ctx.lineWidth=10*r.a+1;ctx.beginPath();ctx.arc(r.x,r.y,r.r,0,7);ctx.stroke()}
 ctx.globalCompositeOperation='source-over';ctx.globalAlpha=1}

function frame(now){const dt=Math.min(3,(now-last)/16.67);last=now;
 ctx.globalCompositeOperation='source-over';ctx.globalAlpha=1;ctx.fillStyle=`hsla(${(244+hue)%360},75%,${inv?32:13}%,${frozen?.4:.22})`;ctx.fillRect(0,0,W,H);
 ctx.save();SX=SY=0;if(shake>.3&&!RM){SX=R(-shake,shake);SY=R(-shake,shake);ctx.translate(SX,SY)}shake*=Math.pow(.92,dt);
 ctx.fillStyle='#f6efe0';for(const s of stars){ctx.globalAlpha=.3+.5*Math.abs(Math.sin(now/900+s.p));ctx.fillRect(s.x*W,s.y*H,s.r,s.r)}ctx.globalAlpha=1;
 const tk=state==='rub'?1:state==='final'?.7:.5,ty=state==='rub'?.6:state==='final'?.8:.58;
 lamp.x=W/2;lamp.k+=(tk-lamp.k)*.06*dt;lamp.y+=(H*ty-lamp.y)*.06*dt;
 drawLamp(state==='rub'?rub:(state==='sink'||state==='final')?1:.3);
 if(state==='play'&&cur){cur.tt+=dt/60;cur.w.fx(cur,dt);while(cur.w.c[cur.cap]&&cur.tt>=cur.w.c[cur.cap][0])setCap(cur.w.c[cur.cap++][1]);if(cur.tt>=cur.w.dur)endWish()}
 if(state==='sink'){sinkT+=dt/60;if(sinkT>4.2)final()}
 if(state==='rub')rub=Math.max(0,rub-.0006*dt);
 peak=Math.max(peak,P.length/260);const ld=Math.round(P.length/2.6);if(ld!==lastLd){lastLd=ld;$('bar').firstChild.style.width=Math.min(100,ld)+'%'}update(dt);for(const r of rings){r.r+=16*dt;r.a-=.02*dt}rings=rings.filter(r=>r.a>0);draw();
 ctx.restore();requestAnimationFrame(frame)}

function summon(){state='genie';rub=0;rubSec=(performance.now()-(rub0||performance.now()))/1000;SFX.genie();shake=25;ring('#14e3c8',lamp.x,lamp.y);ring('#ff2e88',lamp.x,lamp.y);
 for(let i=0;i<140;i++){const a=R(-Math.PI,0),v=R(2,14);sp('●',lamp.x,lamp.y-20,{c:['#14e3c8','#ff2e88','#ffb703'][i%3],vx:Math.cos(a)*v,vy:Math.sin(a)*v,s:R(10,40),life:90,gr:1.01})}
 $('genie').className='on';say(L[0]);showChoices()}
function showChoices(){const used=picks.map(w=>w.n),pool=W8.filter(w=>!used.includes(w.n)).sort(()=>Math.random()-.5).slice(0,4);$('ch').innerHTML='';
 pool.forEach(w=>{const b=document.createElement('button');b.textContent=w.e+' '+w.n;b.onclick=()=>pick(w);$('ch').appendChild(b)})}
function pick(w){SFX.wish();$('ch').innerHTML='';say('');$('genie').classList.add('small');state='play';cur={w,tt:0,cap:0};picks.push(w)}
function endWish(){setCap('');chaos++;hue+=65;frozen=false;ts=1;inv=false;fil();round++;hud();
 $('genie').classList.remove('small');cur=null;
 if(round<3){state='choose';say(L[round]);showChoices()}
 else{state='end';say('三個願望用完了。附帶條款第 4 條：許願者自動接任神燈。');setTimeout(()=>{if(state==='end')sink()},3200)}}
function sink(){$('ch').innerHTML='';say('');state='sink';sinkT=0;$('genie').className='gone';ring('#ff2e88');shake=20;
 sp('🧍',W/2,H*.4,{s:200,life:999});P.forEach(p=>{p.m='suck';p.vx=p.vy=0;p.free=1})}
function final(){state='final';const peakP=Math.round(Math.min(1,peak)*100),score=pops*10+peakP*3,rank=pops<5?'佛系許願人':pops<15?'手滑戳破者':pops<30?'災難清道夫':'混亂製造機';const sw=picks.filter(w=>KIND[w.n]==='爽').length,tl=`爽 ${sw}・損 ${3-sw}：${['神燈今天心情不好','被捉弄的居多','大致是爽的','你是人生贏家'][sw]}`;let best=score;try{best=Math.max(score,+localStorage.getItem('gl_best')||0);localStorage.setItem('gl_best',best)}catch(e){}
 $('sum').innerHTML=picks.map(w=>w.e+' '+w.n).join('<br>')+`<br><br>${tl}<br>稱號：${rank}<br>混亂值 ${score}（個人最佳 ${best}）<br>互動 ${pops} 次，最高災情 ${peakP}%。<br>你的第一位許願者，正在擦燈。`;
 const tx=`我在《許願神燈：願望失控》許了「${picks.map(w=>w.n.replace('我要','')).join('、')}」，${tl}，混亂值 ${score}（${rank}），最後被關進燈裡 🧞`;
 $('shx').href=`https://twitter.com/intent/tweet?text=${encodeURIComponent(tx)}&url=${encodeURIComponent(SHARE)}`;
 $('sht').href=`https://www.threads.net/intent/post?text=${encodeURIComponent(tx+' '+SHARE)}`;
 $('gvmsg').textContent='';/* 玩完：每台裝置只算一次，和許願同單位，比例才有意義 */(()=>{let f=0;try{f=localStorage.getItem('wl_finished')}catch(e){}if(!f)evPost('finish').then(()=>{try{localStorage.setItem('wl_finished','1')}catch(e){}}).catch(()=>{})})();$('end').classList.add('on')}
function restart(){P=[];rings=[];picks=[];round=0;chaos=0;hue=0;rub=0;inv=false;frozen=false;ts=1;fil();state='rub';$('end').classList.remove('on');$('genie').className='';
 pops=0;peak=0;rubSec=0;rub0=0;hud();say('按住神燈，來回擦拭。')}
$('re').onclick=restart;
$('snd').textContent=mute?'🔇':'🔊';$('snd').onclick=()=>{mute=!mute;$('snd').textContent=mute?'🔇':'🔊';try{localStorage.setItem('gl_mute',mute?'1':'0')}catch(e){}if(!mute)SFX.pop()};
const SHARE=location.origin+location.pathname;
async function api(path,opt){if(!API)throw 0;const c=new AbortController(),t=setTimeout(()=>c.abort(),3000);try{const r=await fetch(API+path,{...opt,signal:c.signal});if(!r.ok)throw 0;return await r.json().catch(()=>({}))}finally{clearTimeout(t)}}
const evPost=kind=>api('/event',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({game:'wish-lamp',kind})});
const evCount=async kind=>{const j=await api('/count?game=wish-lamp&kind='+kind);const n=Number(j.n);if(!Number.isFinite(n))throw 0;return n};
$('gv').onclick=async()=>{const b=$('gv'),m=$('gvmsg');if(b.disabled)return;b.disabled=true;let voted=false;try{voted=!!localStorage.getItem('wl_genie_voted')}catch(e){}
 try{if(!voted){try{await evPost('genie_vote')}catch(e){m.textContent='神燈收到你的願望了';return}try{localStorage.setItem('wl_genie_voted','1')}catch(e){}}
  try{const n=await evCount('genie_vote');m.textContent=voted?`目前已有 ${n} 人許願`:`神燈收到你的願望了，目前已有 ${n} 人許願`}catch(e){m.textContent='神燈收到你的願望了'}}finally{b.disabled=false}};
$('cp').onclick=async()=>{try{await navigator.clipboard.writeText(SHARE)}catch(e){try{const t=document.createElement('textarea');t.value=SHARE;document.body.appendChild(t);t.select();document.execCommand('copy');t.remove()}catch(e2){prompt('複製連結',SHARE)}}$('cp').textContent='已複製！';setTimeout(()=>$('cp').textContent='複製連結',1600)};

function mv(e){const x=e.clientX,y=e.clientY,dx=x-mouse.x,dy=y-mouse.y;mouse.x=x;mouse.y=y;
 if(state==='rub'&&mouse.down){const s=lampS();if(Math.hypot(x-lamp.x,y-lamp.y)<190*s){rub=Math.min(1,rub+Math.hypot(dx,dy)/1800);if(!rub0)rub0=performance.now();
  if(Math.random()<.7)sp('●',lamp.x+185*s,lamp.y-80*s,{c:Math.random()<.5?'#14e3c8':'#ff2e88',vx:R(-.5,1),vy:R(-3,-1.2),s:R(14,34),life:70,gr:1.02});
  shake=Math.max(shake,rub*3);if(Math.random()<.25)SFX.rub();if(rub>=1)summon()}}
 if(frozen&&Math.random()<.6)sp('✨',x,y,{free:1,vx:R(-1,1),vy:R(-1,1),s:R(16,30),life:50,gr:.97})}
cv.addEventListener('pointerdown',e=>{mouse.down=true;cv.setPointerCapture(e.pointerId);mv(e);if(state==='play'&&cur)tap(e.clientX,e.clientY)});
addEventListener('pointerup',()=>mouse.down=false);
cv.addEventListener('pointermove',mv);
requestAnimationFrame(frame);
</script>
